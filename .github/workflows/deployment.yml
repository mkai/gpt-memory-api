name: Deployment
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-update-notifier --audit=false --fund=false
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload artifacts
        run: |
          if ! aws s3api head-bucket --bucket gptmem-artifacts 2>/dev/null; then
            aws s3api create-bucket --bucket gptmem-artifacts --acl private --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
          fi

          (cd dist && exec zip -r ${{ github.workspace }}/gptmem-api.zip ./*)
          aws s3 cp gptmem-api.zip s3://gptmem-artifacts/versions/${{ github.sha }}/gptmem-api.zip
        env:
          AWS_REGION: eu-central-1
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy to AWS
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: gptmem
          template: ./cloudformation.yaml
          parameter-overrides: "Environment=production,Version=${{ github.sha }},ArtifactsBucketName=gptmem-artifacts,AllowedTokens='${{ secrets.ALLOWED_TOKENS }}'"

          no-fail-on-empty-changeset: "1"
        env:
          AWS_REGION: eu-central-1
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
